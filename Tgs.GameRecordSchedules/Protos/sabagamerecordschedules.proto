syntax = "proto3";

option csharp_namespace = "Tgs.GameRecordSchedules.Protos";

package sabagamerecordschedules;

// The greeting service definition.
service SabaGameRecordSchedulesService {
  // Sends a greeting
  rpc Merge (MergeRequest) returns (BaseReply);
  rpc Get (GetRequest) returns (GetReply);
}

// The request message containing the user's name.
message MergeRequest {
	string operatorId = 1;
	int64 versionKey = 2;
}

message GetRequest {
	string operatorId = 1;
}

// The response message containing the greetings.
message BaseReply{
	bool success = 1;
}

message GetReply{
	int64 versionKey = 1;
}